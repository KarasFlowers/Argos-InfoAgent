name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Git diff whitespace check
        run: git diff --check
      - name: Docker Compose config check
        run: docker compose config --quiet
      - name: Docker smoke script help
        run: python scripts/docker_smoke.py --help
      - name: Runtime smoke script help
        run: python scripts/runtime_smoke.py --help
      - name: Frontend syntax check
        run: node --check app/web/static/app.js
      - name: Frontend API key smoke
        run: node scripts/frontend_auth_smoke.js

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-rag.txt
      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379/0
          RAG_ENABLED: "false"
        run: python -m pytest
      - name: Runtime smoke
        run: python scripts/runtime_smoke.py --timeout 90
