[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --tb=short"
markers = [
    "integration: marks tests that hit external services or the DB",
    "slow: marks slow-running tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv", "alembic/versions", "data", "logs"]

[tool.ruff.lint]
# Conservative rule set — safe to adopt on an existing codebase.
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length — handled by the formatter
    "B008",  # function calls in argument defaults — common FastAPI Depends() pattern
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports
"tests/*" = ["B011"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["*/tests/*", "*/__pycache__/*", "alembic/*"]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
